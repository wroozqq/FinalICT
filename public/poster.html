<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR poster – Gym Crowd Tracker</title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="poster">
    <img src="/img/logo.svg" alt="Gym Crowd Tracker logo" class="poster-logo">
    <p class="big" id="pType">Scan to check in</p>
    <h1 id="pGym">Gym</h1>
    <img id="pQr" alt="">
    <ol>
      <li>Open your phone camera and point it at the code.</li>
      <li>Enter your anonymous code (or get one in 5 seconds).</li>
      <li>Tap the button. See how busy the gym is – anytime.</li>
    </ol>
    <p class="hint">No name, e-mail or phone number is stored.</p>
    <div class="no-print"><button type="button" id="printBtn">Print poster</button><p class="hint" id="pMsg"></p></div>
  </main>
  <script src="/poster.js"></script>
</body>
</html>
